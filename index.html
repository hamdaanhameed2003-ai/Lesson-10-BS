<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>My Delivery Tracker</h1>
    <button onclick="saveOrder()">Save Order</button>
    <button onclick="startDelivery()">Start Delivery</button>

    <div>JSON Text: <span id="json-text"></span></div>
    <div>Loaded Item: <span id="loaded item"></span></div>
    <div>Loaded Price: <span id="loaded price"></span></div>
    <div>Status: <span id="status"></span></div>
    <div>Result: <span id="result"></span></div>

    <script>

        let order = {
            item: "Pizza",
            price: 5,
            shop: "My Snack Shop"
        };

        function saveOrder() {
            let jsonText    =JSON.Stringify(order);
            let loadedOrder = JSON.parse(jsonText);

            document.getElementId("json-text").innerHTML    = jsonText;
            document.getElementId("loaded-item").innerHTML  = loadedOrder.item;
            document.getElementId("loaded-price").innerHTML =  "$" + loadedOrder.price;
        }

        function delay(ms) {
            return new Promise(function(resolve) {
                setTimeout(resolve, ms);
            });
        }

        
     async function startDelivery() {
        document.getElementById("result").innerHTML = "";

         document.getElementById("status").innerHTML = "Order recieved!";
         setTimeout(function() {
            document.getElementById("Status").innerHTML = "kitchen is preparing...";
         }, 1000);


        await delay(3000);
        document.getElementById("Result").innerHTML = "Out for delivery!";

        await delay(2000);
           





     }
    </script>
</body>
</html>
